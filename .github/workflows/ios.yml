name: Build iOS IPA

on:
  workflow_dispatch: # Allows manual trigger
  push:
    branches:
      - master
    paths:
      - 'lib/**'
      - 'ios/**'
      - 'pubspec.yaml'
      - '.github/workflows/**'

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS App with xcodebuild
        run: |
          # 1. Let Flutter generate the necessary config files using simulator target to bypass signing checks
          flutter build ios --simulator --release --config-only
          
          # 2. Ensure pods are installed
          cd ios
          pod install --repo-update
          
          # 3. Run xcodebuild directly to completely bypass Flutter's signing validation
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination "generic/platform=iOS" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          # The raw xcodebuild puts the app in the DerivedData or local build folder
          mv build/ios/iphoneos/Runner.app Payload/ || mv ios/build/Release-iphoneos/Runner.app Payload/
          zip -r numerical.ipa Payload
          
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: numerical-ios-app
          path: numerical.ipa
